<!DOCTYPE html>
<html>
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <title>Login FAUGET market</title>
    </head>
    <body>
        <main class="formulario league-spartan">
            <form action="index.html" method="get">
                <div>
                    <label for="mail">Correo electrónico:</label>
                    <input id="mail" type="email" name="email" value="">

                <div>
                    <label for="password">Contraseña:</label>

                <div>
                    <button class="league-spartan" type="submit">Ingresar</button>
                </div>
                <div>
                    <a href="register.html" class="boton-link">No tengo cuenta</a>
                </div>
            </form>
        </main>
    </body>
