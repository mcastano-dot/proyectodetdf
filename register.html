<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:ital,wght@0,100..1000;1,100..1000&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
        <title>Register FAUGET market</title>
    </head>
    <body>
        <main class="formulario league-spartan">
            <form action="login.html" method="get">
    <div>
        <label for="mail">Correo electrónico:</label>
        <input id="mail" type="email" name="email" value="">
    </div>
    <div>
        <label for="password">Contraseña:</label>
        <input id="password" type="password" name="password" value="">
    </div>
    <div>
        <label for="pass2">Repetir Contraseña:</label>
        <input id="pass2" type="password" name="pass2" value="">
    </div>
    <div>
        <input id="terminos" type="checkbox" name="terminos" value="acepto">
        <label for="terminos">Acepto términos y condiciones</label>
    </div>
    <div>
        <button class="league-spartan" type="submit">Registrarme</button>
    </div>
    <div>
        <a href="login.html" class="boton-link">Ya tengo una cuenta</a>
    </div>
</form>
        </main>
    </body>
</html>
